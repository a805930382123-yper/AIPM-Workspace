# B07 Prompt Library 规则。六个默认分类的 id 与显示名由本文件冻结，服务端与界面同源读取。
# `help` 只作为分类帮助文案（引用 PRD §34 的例举场景），不会自动生成任何种子 Prompt。
version: b07
categories:
  - id: industry_learning
    label: 行业学习
    help: 学习快消行业的基础概念与结构，例如行业术语解释、渠道体系梳理、品类基础知识、供应链与门店运营概念。
  - id: business_analysis
    label: 业务分析
    help: 分析业务流程与经营问题，例如动销与库存分析、促销复盘、经销商经营诊断、指标拆解与归因。
  - id: customer
    label: 客户
    help: 面向客户与门店的工作方法，例如客户访谈提纲、门店走访记录整理、客户需求澄清、异议处理。
  - id: product
    label: 产品
    help: 产品与商品相关工作，例如新品卖点提炼、产品资料整理、包装与规格说明、产品对比分析。
  - id: ai
    label: AI
    help: 用 AI 辅助业务工作的提问方法，例如让 AI 拆解业务流程、整理会议纪要、检查方案缺项、生成分析框架。
  - id: office
    label: 日常办公
    help: 日常事务类模板，例如周报与月报整理、会议纪要、行动计划拆分、汇报材料大纲。
