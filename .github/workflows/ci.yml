name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  checks:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        node: [22.x, 24.x]
    steps:
      - run: git config --global core.autocrlf false
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run guard
      - run: npm test
        env:
          FMCG_DATA_DIR: ${{ runner.temp }}/fmcg-data
          FMCG_LLM_CONFIG_FILE: ${{ runner.temp }}/fmcg-config.env
      - run: npm run eval -- --chain standard-extract --recording live-20261115-baseline
      - run: npm run eval -- --chain news-relevance --recording synthetic-v1
      - run: npm run eval -- --chain weekly-review --mode replay
      - run: npm run build
